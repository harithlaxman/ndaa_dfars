# set in the repo-root .env: MONGO_CLIENT_URI=mongodb://localhost:27017
services:
  mongo:
    image: mongo:7
    container_name: ndaa_dfars_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
